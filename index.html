<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CEPI JRM</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body { font-family: 'Courier New', monospace; color: #fff8e7; }
    #jogo { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #jogo canvas { image-rendering: pixelated; image-rendering: crisp-edges; }

    /* nome do bloco no canto */
    #hudBloco {
      position: fixed; top: 12px; left: 12px; z-index: 5;
      padding: 4px 10px; background: rgba(42, 29, 26, .75); border: 2px solid #2a1d1a;
      font-size: 14px; font-weight: bold; letter-spacing: 1px;
    }

    /* relógio do jogo: dia e hora, no alto, no meio */
    #hudRelogio {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 5;
      padding: 4px 14px; background: rgba(42, 29, 26, .75); border: 2px solid #2a1d1a;
      font-size: 16px; font-weight: bold; letter-spacing: 1px; color: #f6d34a;
    }
    #hudRelogio:empty { display: none; }

    /* botão de som no canto */
    #hudSom {
      position: fixed; top: 12px; right: 12px; z-index: 5;
      width: 40px; height: 32px; padding: 0; cursor: pointer;
      background: rgba(42, 29, 26, .75); border: 2px solid #2a1d1a; color: #fff8e7; font-size: 18px;
    }
    #hudAjuda {
      position: fixed; bottom: 8px; right: 12px; z-index: 4; font-size: 12px;
      padding: 2px 8px; background: rgba(42, 29, 26, .6); pointer-events: none;
    }

    /* menu (pausa e aulas) e cadastro (tela inicial: nome e série) */
    #menu, #cadastro {
      position: fixed; inset: 0; z-index: 11; padding: 16px;
      display: flex; align-items: center; justify-content: center; background: rgba(18, 12, 11, .72);
    }
    #menuCaixa, #cadastroCaixa {
      width: min(620px, 100%); max-height: calc(100% - 16px); overflow-y: auto;
      padding: 18px 20px; background: #fff8e7; color: #2a1d1a;
      border: 4px solid #2a1d1a; box-shadow: 0 0 0 3px #c9a26b;
    }
    #cadastroCaixa { width: min(460px, 100%); display: flex; flex-direction: column; gap: 10px; }
    #cadastroTitulo { font-size: 26px; font-weight: bold; color: #b5473a; }
    #cadastroSub { font-size: 14px; margin-top: -8px; margin-bottom: 6px; }
    #cadastroCaixa label, #cadastroRotuloSerie { font-size: 16px; font-weight: bold; }
    #cadastroNome {
      font: inherit; font-size: 18px; padding: 8px 10px; color: #2a1d1a; background: #fff;
      border: 3px solid #2a1d1a; outline: none;
    }
    #cadastroNome:focus { box-shadow: 0 0 0 3px #f6d34a; }
    #cadastroSeries { display: flex; gap: 8px; }
    #cadastroSeries button, #cadastroOk {
      font: inherit; font-size: 16px; cursor: pointer; padding: 8px 12px;
      background: #e8d3a8; color: #2a1d1a; border: 3px solid #2a1d1a;
    }
    #cadastroSeries button { flex: 1; }
    #cadastroSeries button[aria-checked="true"] { background: #f6d34a; font-weight: bold; }
    #cadastroSeries button:focus-visible, #cadastroOk:focus-visible { outline: 3px solid #b5473a; outline-offset: 1px; }
    #cadastroOk { margin-top: 6px; font-weight: bold; background: #f6d34a; }
    #cadastroErro { color: #b5473a; font-size: 14px; font-weight: bold; }
    #menuTitulo { font-size: 22px; font-weight: bold; color: #b5473a; margin-bottom: 10px; }
    #menuTexto { font-size: 17px; line-height: 1.45; white-space: pre-wrap; margin-bottom: 14px; }
    #menuOpcoes { display: flex; flex-direction: column; gap: 6px; }
    #menuOpcoes button {
      font: inherit; font-size: 16px; text-align: left; cursor: pointer;
      padding: 8px 12px; background: #e8d3a8; color: #2a1d1a; border: 3px solid #2a1d1a;
    }
    #menuOpcoes button.sel { background: #f6d34a; }
    #menuOpcoes button.sel::before { content: '▶ '; }

    /* faixa que aparece ao entrar num bloco */
    #faixaBloco {
      position: fixed; top: 18%; left: 50%; transform: translateX(-50%); z-index: 6;
      text-align: center; pointer-events: none; opacity: 0;
      padding: 10px 36px; background: rgba(42, 29, 26, .85); border: 3px solid #f6d34a;
    }
    #faixaBloco.ativa { animation: faixa 2.6s ease forwards; }
    #faixaNome { font-size: 26px; font-weight: bold; color: #f6d34a; }
    #faixaSub { font-size: 15px; margin-top: 2px; }
    @keyframes faixa {
      0% { opacity: 0; transform: translate(-50%, -10px); }
      15%, 75% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, 0); }
    }

    /* balão de fala: fica em cima da cabeça de quem fala (o motor.js posiciona).
       --cauda = onde fica a pontinha do balão; .embaixo = sem espaço em cima, vai para baixo do NPC */
    #dialogo {
      position: fixed; left: 0; top: 0; z-index: 7; box-sizing: border-box;
      max-width: min(340px, calc(100% - 16px)); padding: 8px 12px 14px;
      background: #fff8e7; color: #2a1d1a; border: 3px solid #2a1d1a; border-radius: 10px;
      box-shadow: 0 3px 0 rgba(0, 0, 0, .3); cursor: pointer; user-select: none;
    }
    #dialogo::before, #dialogo::after {
      content: ''; position: absolute; left: var(--cauda, 50%); transform: translateX(-50%);
      width: 0; height: 0; border-style: solid; border-color: transparent;
    }
    #dialogo::before { bottom: -14px; border-width: 14px 10px 0; border-top-color: #2a1d1a; }
    #dialogo::after { bottom: -9px; border-width: 10px 7px 0; border-top-color: #fff8e7; }
    #dialogo.embaixo::before { bottom: auto; top: -14px; border-width: 0 10px 14px; border-color: transparent transparent #2a1d1a; }
    #dialogo.embaixo::after { bottom: auto; top: -9px; border-width: 0 7px 10px; border-color: transparent transparent #fff8e7; }
    #dialogoNome { font-weight: bold; color: #b5473a; margin-bottom: 2px; font-size: 13px; }
    #dialogoTexto { font-size: 15px; line-height: 1.35; white-space: pre-wrap; }
    #dialogoSeta { position: absolute; right: 7px; bottom: 1px; font-size: 11px; animation: pisca .8s steps(2) infinite; }
    @keyframes pisca { 50% { opacity: 0; } }

    /* tela de carregamento */
    #carregando {
      position: fixed; inset: 0; z-index: 10; background: #120c0b;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; padding: 16px; text-align: center;
    }
    #carregandoTitulo { font-size: 22px; font-weight: bold; color: #f6d34a; }
    #carregandoDica { max-width: 560px; padding: 14px 18px; border: 3px solid #5d6b7a; background: #1d1614; }
    #carregandoDica strong { display: block; color: #6aa8ec; margin-bottom: 6px; }
    #carregandoFrase { font-size: 16px; line-height: 1.45; }

    @media (max-width: 520px) {
      #dialogoTexto { font-size: 14px; }
      #faixaNome { font-size: 20px; }
    }
  </style>
</head>
<body>
  <div id="jogo"></div>

  <div id="hudBloco"></div>
  <div id="hudRelogio"></div>
  <button id="hudSom" type="button" title="Desligar o som (M)">🔊</button>
  <div id="hudAjuda">ESC pausa · M som · T tempo · G grade</div>

  <!-- tela inicial: nome (os NPCs chamam o estudante por ele) e série (aulas) -->
  <div id="cadastro" hidden>
    <form id="cadastroCaixa" autocomplete="off" novalidate>
      <div id="cadastroTitulo">CEPI JRM</div>
      <div id="cadastroSub">CEPI João Roberto Moreira</div>
      <label for="cadastroNome">Qual é o seu nome?</label>
      <input id="cadastroNome" type="text" maxlength="20" placeholder="Digite seu nome" spellcheck="false">
      <div id="cadastroRotuloSerie">Qual é a sua série?</div>
      <div id="cadastroSeries" role="radiogroup" aria-labelledby="cadastroRotuloSerie">
        <button type="button" role="radio" aria-checked="false" data-serie="1">1º ano</button>
        <button type="button" role="radio" aria-checked="false" data-serie="2">2º ano</button>
        <button type="button" role="radio" aria-checked="false" data-serie="3">3º ano</button>
      </div>
      <div id="cadastroErro" role="alert" hidden></div>
      <button id="cadastroOk" type="submit">▶ Começar</button>
    </form>
  </div>

  <div id="menu" hidden>
    <div id="menuCaixa" role="dialog" aria-modal="true">
      <div id="menuTitulo"></div>
      <div id="menuTexto"></div>
      <div id="menuOpcoes"></div>
    </div>
  </div>

  <div id="faixaBloco">
    <div id="faixaNome"></div>
    <div id="faixaSub"></div>
  </div>

  <div id="dialogo" hidden>
    <div id="dialogoNome"></div>
    <div id="dialogoTexto"></div>
    <span id="dialogoSeta" hidden>▼</span>
  </div>

  <div id="carregando">
    <div id="carregandoTitulo">Carregando...</div>
    <div id="carregandoDica" hidden>
      <strong>Você sabia?</strong>
      <div id="carregandoFrase"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
  <script src="arte.js"></script>
  <script src="curiosidades.js"></script>
  <script src="motor.js"></script>
  <script>VilaPixel.iniciar(document.getElementById('jogo'));</script>
</body>
</html>
